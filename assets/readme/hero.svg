<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">我們家的小助手</title>
  <desc id="desc">以織物質感紙卡呈現行事曆、食譜、帳本與購買紀錄四項家庭共用工具。</desc>
  <defs><pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 3h12M0 9h12M3 0v12M9 0v12" fill="none" stroke="#dcd0c2" stroke-opacity=".42" stroke-width="1"/></pattern></defs>
  <rect width="1200" height="390" rx="30" fill="#e6e2d8"/><rect x="1" y="1" width="1198" height="388" rx="29" fill="url(#weave)" opacity=".72"/>
  <g transform="translate(64 60)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC',sans-serif">
    <text fill="#5f7186" font-size="20" font-weight="700" letter-spacing="3">FAMILY UTILITY · NEXT.JS + FIREBASE</text><text y="62" fill="#3d3a36" font-size="58" font-weight="800">我們家的小助手</text><text y="105" fill="#5f6368" font-size="26">把生活中常用的四件事，收進一個全家共用的空間。</text><path d="M0 138h450" stroke="#b87e6b" stroke-width="4" stroke-linecap="round"/><text y="185" fill="#3d3a36" font-size="22" font-weight="700">行程安排 · 食譜換算 · 家庭收支 · 購買紀錄</text><text y="224" fill="#5f6368" font-size="19">Google 登入後同步到 Firestore；本機快取讓已讀資料可快速開啟。</text>
    <g transform="translate(0 254)"><rect width="154" height="42" rx="21" fill="#f0ece1" stroke="#dcd0c2" stroke-width="2" stroke-dasharray="6 5"/><text x="77" y="27" text-anchor="middle" fill="#3d3a36" font-size="17" font-weight="700">靜態匯出</text><rect x="170" width="154" height="42" rx="21" fill="#f0ece1" stroke="#dcd0c2" stroke-width="2" stroke-dasharray="6 5"/><text x="247" y="27" text-anchor="middle" fill="#3d3a36" font-size="17" font-weight="700">PWA 支援</text></g>
  </g>
  <g transform="translate(755 47)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC',sans-serif"><rect width="380" height="296" rx="24" fill="#f0ece1" stroke="#dcd0c2" stroke-width="2" stroke-dasharray="8 6"/><text x="30" y="42" fill="#3d3a36" font-size="22" font-weight="800">今天的家庭桌面</text><g transform="translate(28 67)"><rect width="150" height="88" rx="16" fill="#e6e2d8"/><rect x="170" width="154" height="88" rx="16" fill="#e6e2d8"/><text x="20" y="30" fill="#5f7186" font-size="18" font-weight="800">行事曆</text><text x="20" y="59" fill="#3d3a36" font-size="24" font-weight="800">08 / 27</text><path d="M20 72h104" stroke="#5f7186" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 5"/><text x="190" y="30" fill="#b87e6b" font-size="18" font-weight="800">家庭帳本</text><path d="M190 50h104" stroke="#b87e6b" stroke-width="8" stroke-linecap="round"/><path d="M190 72h68" stroke="#dcd0c2" stroke-width="8" stroke-linecap="round"/></g><g transform="translate(28 174)"><rect width="150" height="88" rx="16" fill="#e6e2d8"/><rect x="170" width="154" height="88" rx="16" fill="#e6e2d8"/><text x="20" y="30" fill="#b87e6b" font-size="18" font-weight="800">食譜</text><text x="20" y="56" fill="#3d3a36" font-size="16" font-weight="800">4 人份</text><text x="20" y="77" fill="#3d3a36" font-size="16" font-weight="800">→ 2 人份</text><text x="190" y="30" fill="#5f7186" font-size="18" font-weight="800">購買</text><text x="190" y="58" fill="#3d3a36" font-size="19" font-weight="800">手機 · 已購入</text></g></g><circle cx="1143" cy="47" r="11" fill="#b87e6b"/>
</svg>
